name: Claude

# On-demand: mention @claude in an issue, a PR comment, or a review. Useful here for
# the long analysis issues (#33, #41) where the question is "is this still true of the
# current code" — Claude can check the files rather than trust a body written in July.
#
# `issue_comment` is what catches comments on a PR. `pull_request_review_comment` does
# NOT — it fires when a review is submitted, which is why @claude in a plain PR comment
# looks like it does nothing. Both are wired below.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          # Repo conventions are NOT passed as --system-prompt: a long quoted string
          # in multiline claude_args hits the same parsing bug as the tool patterns
          # (anthropics/claude-code-action#844). CLAUDE.md at the repo root is the
          # right home for them and the action reads it on checkout.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Skill(code-review)",
                  "Bash(gh pr comment:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(gh pr view:*)",
                  "Bash(gh pr list:*)",
                  "Bash(gh issue view:*)",
                  "Bash(gh issue list:*)",
                  "Bash(gh issue comment:*)",
                  "Bash(gh search:*)",
                  "mcp__github_inline_comment__create_inline_comment",
                  "mcp__github_comment__update_claude_comment"
                ]
              }
            }

          claude_args: |
            --model sonnet
