name: Claude review

# Automatic review on PRs into main or dev. #41's Definition of Done requires
# branching from dev, so both bases have to be covered or half the PRs go unreviewed.
#
# `synchronize` is deliberately NOT in the types list: it fires on every push to the
# branch, and on a subscription plan that is the difference between one review per PR
# and one per commit. Add it if you want re-review after fixes.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    branches: [main, dev]
    # Code only. docs/, skill/ and artifacts_final/ are prose and frozen eval
    # snapshots; reviewing them spends tokens on diffs with no invariants to check.
    paths:
      - "src/**"
      - "preprocessing/**"
      - "optimization/**"
      - "reporting/**"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          # Test: the built-in /code-review skill at high effort instead of the plugin.
          prompt: |
            Run the built-in /code-review skill at high effort on
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Post each finding as an inline comment on the changed line.

          claude_args: '--allowedTools "Skill(code-review),Skill(code-review:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"'
          # Headless runs end when Claude ends its turn, so background sub-agents
          # never report back. Run them in the foreground.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
