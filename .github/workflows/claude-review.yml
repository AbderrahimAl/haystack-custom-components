name: Claude review

# Sandbox: `synchronize` IS included here so pushing a fix re-triggers the review
# while testing. Leave it out in production repos — it means one review per push.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/**"

jobs:
  review:
    # The zenn.dev article's configuration, plus what makes the plugin's result
    # visible: --comment, write access, its gh tools and the full log (test only).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The tools the plugin's command declares in its allowed-tools header.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
          # Test only: the logs of a public repository are public.
          show_full_output: true
